<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>干地 · 水上求生</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#03060c;color:#e8f1fa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Serif SC","Microsoft YaHei",sans-serif;user-select:none}
  #bgg{position:fixed;inset:0;width:100%;height:100%}
  .vig{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 34%,rgba(0,0,0,.62) 100%);pointer-events:none}
  .stage{position:fixed;inset:0;overflow:hidden}

  /* portraits */
  .cast{position:absolute;inset:0}
  .pt{position:absolute;bottom:132px;width:44vw;max-width:270px;height:auto;opacity:.42;filter:saturate(.6) brightness(.62);transition:opacity .45s,filter .45s,transform .45s;transform:translateY(14px) scale(.97)}
  .pt.l{left:-3vw}
  .pt.r{right:-3vw}
  .pt.on{opacity:1;filter:none;transform:translateY(0) scale(1)}
  .pt.up{transform:translateY(-6px) scale(1.02)}
  .pt svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}

  /* dialogue */
  .box{position:absolute;left:0;right:0;bottom:0;padding:0 0 max(12px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(4,9,18,0) 0%,rgba(4,9,18,.86) 26%,rgba(3,6,12,.97) 100%)}
  .inner{max-width:760px;margin:0 auto;padding:0 20px 16px}
  .who{display:inline-block;font-size:12.5px;letter-spacing:.24em;color:#8fd8ff;margin-bottom:8px;padding:3px 12px;border-radius:999px;background:rgba(24,74,110,.5);border:1px solid rgba(120,210,255,.28)}
  .line{font-size:16.5px;line-height:1.95;min-height:100px;color:#e2edf8;letter-spacing:.01em;text-shadow:0 1px 12px rgba(0,0,0,.6)}
  .line .em{color:#ffd98a}
  .nxt{text-align:right;font-size:11.5px;color:#6d90b2;letter-spacing:.18em;height:16px;animation:bl 1.8s infinite}
  @keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
  .opts{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .opts button{text-align:left;font-family:inherit;font-size:14.5px;line-height:1.55;color:#dbeaf8;padding:12px 16px;border-radius:12px;border:1px solid rgba(120,190,240,.24);background:rgba(22,44,72,.6);cursor:pointer;transition:.16s}
  .opts button:hover{background:rgba(40,80,124,.72);border-color:rgba(150,220,255,.55);transform:translateX(2px)}

  /* hud */
  .hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;padding:0 64px 0 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
  .loc{font-size:11px;letter-spacing:.34em;color:#7fa0bf}
  .pills{display:flex;gap:10px}
  .pill{font-size:10.5px;letter-spacing:.1em;color:#8fb0cc;background:rgba(8,20,36,.6);border:1px solid rgba(110,170,220,.18);padding:4px 9px;border-radius:999px}
  .pill b{color:#dff0ff;font-weight:600;margin-left:3px}

  /* battle */
  .bat{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:7;background:radial-gradient(ellipse at 50% 38%,rgba(10,20,34,.7),rgba(2,5,10,.95));backdrop-filter:blur(3px)}
  .bat.on{display:flex}
  .bat .topbar{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;padding:0 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .bat .ename{font-size:11.5px;letter-spacing:.26em;color:#ffab97}
  .bat .ename b{display:block;font-size:19px;letter-spacing:.06em;color:#ffe6dd;margin-top:5px;font-weight:600}
  .hpbar{height:6px;border-radius:3px;background:rgba(255,255,255,.13);overflow:hidden;margin-top:7px;width:min(42vw,200px)}
  .hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5a5a,#ff9a6a);transition:width .35s ease}
  .hpbar.p i{background:linear-gradient(90deg,#5fc3ff,#9df0d2)}
  .bat .art{height:min(42vh,320px);display:flex;align-items:center;justify-content:center;margin-top:6vh}
  .bat .art svg{height:100%;width:auto;filter:drop-shadow(0 24px 40px rgba(0,0,0,.65))}
  .bat .msg{max-width:620px;padding:0 26px;margin-top:4vh;font-size:15px;line-height:1.9;color:#cfe0f0;text-align:center;min-height:56px}
  .bat .acts{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:560px;margin:0 auto}
  .bat .acts button{font-family:inherit;font-size:14px;padding:13px 10px;border-radius:12px;border:1px solid rgba(120,190,240,.25);background:rgba(22,44,72,.66);color:#dcecfa;cursor:pointer;transition:.15s}
  .bat .acts button:hover{background:rgba(44,86,132,.8);border-color:rgba(150,220,255,.5)}
  .bat .acts button:disabled{opacity:.35}
  .shake{animation:sh .32s}
  @keyframes sh{0%,100%{transform:translate(0,0)}25%{transform:translate(-7px,3px)}50%{transform:translate(6px,-4px)}75%{transform:translate(-4px,-2px)}}
  .flashw{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8;transition:opacity .18s}
  .mute{position:fixed;top:max(14px,env(safe-area-inset-top));right:16px;z-index:6;width:38px;height:38px;border-radius:999px;border:1px solid rgba(120,190,240,.24);background:rgba(8,20,36,.62);color:#9fc4e4;font-size:15px;cursor:pointer;font-family:inherit}
  .mute.off{color:#5a6c7e;border-color:rgba(120,190,240,.12)}

  /* title / end */
  .cover{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#0d2340,#03060c 72%);z-index:9;transition:opacity .6s}
  .cover.hide{opacity:0;pointer-events:none}
  .coverbox{text-align:center;padding:0 26px}
  .coverbox .k{font-size:10.5px;letter-spacing:.5em;color:#6f92b4}
  .coverbox h1{font-size:44px;letter-spacing:.16em;font-weight:600;margin:14px 0 6px;color:#eaf6ff;text-shadow:0 0 40px rgba(110,190,255,.4)}
  .coverbox h1 span{color:#8fd8ff}
  .coverbox p{font-size:13px;color:#8aa3be;line-height:2;margin-top:10px}
  .coverbox button{margin-top:30px;padding:14px 52px;border:0;border-radius:999px;font-family:inherit;font-size:14.5px;font-weight:600;letter-spacing:.24em;color:#03121f;background:linear-gradient(135deg,#8fe6ff,#7ea6ff);box-shadow:0 14px 40px rgba(110,190,255,.3);cursor:pointer}
  .coverbox .again{margin-top:14px;display:block;font-size:11.5px;color:#6b88a8;letter-spacing:.16em;cursor:pointer;background:none;border:0;font-family:inherit;width:100%}
</style>
</head>
<body>
<canvas id="bgg"></canvas>
<div class="vig"></div>

<div class="stage">
  <div class="cast" id="cast"></div>
  <div class="hud">
    <div class="loc" id="loc">无风带 · 第 3 天</div>
    <div class="pills">
      <div class="pill">血<b id="pH">100</b></div>
      <div class="pill">水<b id="pW">62</b></div>
      <div class="pill">食<b id="pF">55</b></div>
      <div class="pill">信<b id="pT">40</b></div>
    </div>
  </div>
  <div class="box">
    <div class="inner">
      <div class="who" id="who">马林</div>
      <div class="line" id="line"></div>
      <div class="opts" id="opts"></div>
      <div class="nxt" id="nxt"></div>
    </div>
  </div>
</div>

<button class="mute" id="muteBtn" title="音乐">♪</button>

<div class="bat" id="battle">
  <div class="topbar">
    <div>
      <div class="ename">敌方<b id="bName">鲨鱼</b></div>
      <div class="hpbar"><i id="bHp"></i></div>
    </div>
    <div style="text-align:right">
      <div class="ename">马林<b id="pHpNum">100</b></div>
      <div class="hpbar p"><i id="pHp"></i></div>
    </div>
  </div>
  <div class="art" id="bArt"></div>
  <div class="msg" id="bMsg"></div>
  <div class="acts" id="bActs"></div>
</div>
<div class="flashw" id="flashw"></div>

<div class="cover" id="cover">
  <div class="coverbox">
    <div class="k">A TALE OF THE FLOODED EARTH</div>
    <h1>干<span>地</span></h1>
    <p>水升上来了，没有退下去。<br>最后一块陆地沉进海里的时候，人们开始朝北走。<br>没人见过那块地，但每个人都在讲它。</p>
    <button id="startBtn">开始</button>
    <button class="again" id="continueBtn" style="display:none">继续上次</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 人物 ================= */
  var C = {
    marin: { name: '马林', pal: { skin: '#8e9fae', skin2: '#6f8192', hair: '#1b222c', cloth: '#1d2b3a', accent: '#4f8fae' }, gills: true },
    xiaoman: { name: '小满', pal: { skin: '#e0b48d', skin2: '#c08e63', hair: '#7b3a26', cloth: '#8a6440', accent: '#d58d5c' } },
    deacon: { name: '迪肯', pal: { skin: '#b07a5c', skin2: '#824f38', hair: '#2b1a12', cloth: '#2a211c', accent: '#e0602a' }, scar: true, bald: true },
    bri: { name: '老布里', pal: { skin: '#c79c7c', skin2: '#9a6f53', hair: '#c9c4bb', cloth: '#3e4a44', accent: '#8fae74' }, beard: true, goggles: true }
  };

  function portrait(id) {
    var c = C[id], p = c.pal;
    var hair = c.bald ? '' :
      '<path d="M46 96 C44 52 74 38 100 38 C128 38 156 54 154 96 C148 74 132 62 100 62 C70 62 54 74 46 96 Z" fill="' + p.hair + '"/>' +
      '<path d="M46 96 C50 84 62 78 70 80 C62 86 58 94 56 104 Z" fill="' + p.hair + '"/>' +
      '<path d="M154 96 C150 84 138 78 130 80 C138 86 142 94 144 104 Z" fill="' + p.hair + '"/>';
    var beard = c.beard ?
      '<path d="M70 150 C74 178 88 192 100 192 C112 192 126 178 130 150 C126 168 114 176 100 176 C86 176 74 168 70 150 Z" fill="' + p.hair + '" opacity=".92"/>' : '';
    var goggles = c.goggles ?
      '<g opacity=".95"><rect x="62" y="72" width="30" height="22" rx="10" fill="#1a2733" stroke="' + p.accent + '" stroke-width="2.5"/><rect x="108" y="72" width="30" height="22" rx="10" fill="#1a2733" stroke="' + p.accent + '" stroke-width="2.5"/><rect x="92" y="80" width="16" height="5" fill="' + p.accent + '"/></g>' :
      '<ellipse cx="82" cy="106" rx="10" ry="5.4" fill="#f2f8ff"/><circle cx="83" cy="106" r="3.1" fill="#16202b"/><ellipse cx="118" cy="106" rx="10" ry="5.4" fill="#f2f8ff"/><circle cx="117" cy="106" r="3.1" fill="#16202b"/>' +
      '<path d="M70 93 C76 88 88 88 94 92" stroke="' + p.hair + '" stroke-width="3.4" stroke-linecap="round" fill="none"/>' +
      '<path d="M106 92 C112 88 124 88 130 93" stroke="' + p.hair + '" stroke-width="3.4" stroke-linecap="round" fill="none"/>';
    var scar = c.scar ?
      '<path d="M126 84 L118 122 L124 150" stroke="#f0d9c8" stroke-width="2" opacity=".55" fill="none"/>' : '';
    var gills = c.gills ?
      '<g stroke="#3f6b7d" stroke-width="2.2" opacity=".8" fill="none"><path d="M64 128 q10 6 0 12"/><path d="M70 126 q10 7 0 14"/><path d="M136 128 q-10 6 0 12"/><path d="M130 126 q-10 7 0 14"/></g>' : '';
    return '<svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><linearGradient id="g' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + p.cloth + '"/><stop offset="1" stop-color="#0a0f16"/></linearGradient></defs>' +
      '<path d="M28 230 C28 186 56 166 100 166 C144 166 172 186 172 230 Z" fill="url(#g' + id + ')"/>' +
      '<path d="M78 158 h44 v18 c0 10 -8 16 -22 16 c-14 0 -22 -6 -22 -16 Z" fill="' + p.skin2 + '"/>' +
      '<ellipse cx="100" cy="112" rx="46" ry="50" fill="' + p.skin + '"/>' +
      '<ellipse cx="100" cy="118" rx="46" ry="44" fill="' + p.skin + '" opacity=".6"/>' +
      hair + beard + goggles + scar + gills +
      '<path d="M92 138 C96 142 104 142 108 138" stroke="' + p.skin2 + '" stroke-width="3.2" stroke-linecap="round" fill="none"/>' +
      '<path d="M100 118 L96 130 L103 130" stroke="' + p.skin2 + '" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".8"/>' +
      '<path d="M100 168 C96 152 104 152 100 168" fill="' + p.skin2 + '" opacity=".5"/>' +
      '</svg>';
  }

  /* ================= 剧本 ================= */
  var SCENES = {
    cover: '无风带 · 第 3 天',
    sea: '无风带 · 第 5 天',
    atoll: '浮城环礁',
    night: '夜海',
    storm: '风暴 · 第 11 天',
    shore: '浅滩'
  };

  var N = {
    start: {
      bg: 'sea', loc: '无风带 · 第 5 天', cast: [['marin', 'l']],
      lines: [
        { w: '马林', t: '（第 5 天。帆垂着，像一块湿布。）' },
        { w: '马林', t: '水还有半桶。鱼线断了三根。往北，一直往北。' },
        { w: '马林', t: '（远处的水面上，漂着一样不该漂着的东西——一只木箱，箱上绑着绳子。）' }
      ],
      choices: [
        { t: '靠过去，把箱子捞上来', go: 'box', eff: { trust: 2 } },
        { t: '不惹麻烦，绕开', go: 'skipbox', eff: { water: -3 } }
      ]
    },
    box: {
      bg: 'sea', cast: [['marin', 'l']],
      lines: [
        { w: '马林', t: '箱子不重。打开的时候，里头蜷着一个人。' },
        { w: '小满', t: '……别把我扔回去。' },
        { w: '马林', t: '一个小孩。嘴唇干得裂开，眼睛却亮得反常。' },
        { w: '小满', t: '他们有枪。迪肯的人。他们要把我背上的东西刮下来。' }
      ],
      choices: [
        { t: '把她拉上船', go: 'takeher', eff: { water: -6, trust: 14 } },
        { t: '给她半壶水，让她自己漂', go: 'leaveher', eff: { water: -3, trust: -10 } }
      ]
    },
    skipbox: {
      bg: 'sea', cast: [['marin', 'l']],
      lines: [
        { w: '马林', t: '（你调开船头。）' },
        { w: '马林', t: '（半夜，你听见水里有划水的声音。很小，断断续续，像有人在追。）' },
        { w: '小满', t: '……喂。喂！' },
        { w: '马林', t: '（一个小孩，抱着一块木板，追了你三个小时。）' }
      ],
      choices: [
        { t: '拉她上来', go: 'takeher', eff: { water: -6, trust: 10 } },
        { t: '当没听见', go: 'bad1', eff: { trust: -20 } }
      ]
    },
    bad1: {
      bg: 'night', cast: [['marin', 'l']],
      lines: [
        { w: '马林', t: '（你听见那声划水停了。然后什么都没有了。）' },
        { w: '马林', t: '（你告诉自己，一个人的水，撑不了两个人。）' },
        { w: '马林', t: '（可你一夜没睡着。树影在帆上晃，像一只小小的手。）' }
      ],
      next: 'atoll0'
    },
    leaveher: {
      bg: 'night', cast: [['marin', 'l']],
      lines: [
        { w: '马林', t: '（你给了她水。她说了声谢谢，声音轻得像没有。）' },
        { w: '马林', t: '（你把船开走了。回头看，她抱着木板坐在水上，越来越小。）' },
        { w: '马林', t: '（三小时后，你听见身后有引擎声——不是你。）' }
      ],
      next: 'atoll0'
    },
    takeher: {
      bg: 'sea', cast: [['marin', 'l'], ['xiaoman', 'r']],
      lines: [
        { w: '小满', t: '我叫小满。我娘说，满月那天的孩子能看见水底。' },
        { w: '马林', t: '你背上是什么。' },
        { w: '小满', t: '（她解开上衣一角，肩胛骨上有一圈褪色的纹身，像一张图。）' },
        { w: '小满', t: '娘说，跟着它走，就能走到干地。' },
        { w: '马林', t: '（干地。讲了三十年的东西。）' }
      ],
      choices: [
        { t: '「那就往北。」', go: 'atoll1', eff: { trust: 8 } },
        { t: '「我送你到环礁，你换条船自己走。」', go: 'atoll1', eff: { trust: -6 } }
      ]
    },

    atoll0: {
      bg: 'atoll', loc: '浮城环礁', cast: [['marin', 'l'], ['bri', 'r']],
      lines: [
        { w: '老布里', t: '一个人？一个人还想换水？' },
        { w: '马林', t: '我有旧图。' },
        { w: '老布里', t: '图不值钱了，小子。这年头值钱的是土。一捧土，一桶水。' }
      ],
      choices: [
        { t: '用最后一点土换水', go: 'atollTrade', eff: { water: 26, trust: 2 } },
        { t: '换消息：往北的路', go: 'atollTrade2', eff: { trust: 6 } }
      ]
    },
    atoll1: {
      bg: 'atoll', loc: '浮城环礁', cast: [['marin', 'l'], ['bri', 'r'], ['xiaoman', 'r']],
      lines: [
        { w: '老布里', t: '（他盯着小满，手里的烟斗停在半空。）' },
        { w: '老布里', t: '这孩子……背上那个圈，你看见了吗。' },
        { w: '马林', t: '看见了。' },
        { w: '老布里', t: '三十年前有个女人也带着这个圈，从这儿往北去了。再没回来过。' },
        { w: '老布里', t: '不过她走的时候，船上装满了水。你们这样，走不到。' }
      ],
      choices: [
        { t: '把土全给他，换足水和药', go: 'atollTrade', eff: { water: 30, trust: 8 } },
        { t: '只换够三天的', go: 'hunt1', eff: { water: 14, trust: -2 } },
        { t: '不换，直接走', go: 'hunt1', eff: { trust: -4 } }
      ]
    },
    atollTrade: {
      bg: 'atoll', cast: [['marin', 'l'], ['bri', 'r']],
      lines: [
        { w: '老布里', t: '（他把水一桶桶推过来，动作很慢，像在称什么。）' },
        { w: '老布里', t: '小子。北边有一道暖流，跟着它走三天，会看见鸟。' },
        { w: '老布里', t: '看见鸟就往鸟飞的方向走。别管烟，别管浪。' },
        { w: '马林', t: '你为什么告诉我。' },
        { w: '老布里', t: '（他笑了一下，露出缺的牙。）因为我老了。老的人看不得小孩死。' }
      ],
      next: 'hunt1'
    },
    atollTrade2: {
      bg: 'atoll', cast: [['marin', 'l'], ['bri', 'r']],
      lines: [
        { w: '老布里', t: '往北。顺着暖流，看见鸟就跟着鸟。' },
        { w: '老布里', t: '还有——烟者在找你这样的船。他们的头儿叫迪肯，烧柴油烧到脑子坏掉。' },
        { w: '老布里', t: '他也在找干地。他找干地不是为了活，是为了让所有人都知道是他先到的。' }
      ],
      next: 'hunt1'
    },

    storm1: {
      bg: 'storm', loc: '风暴 · 第 11 天', cast: [['marin', 'l'], ['xiaoman', 'r']],
      lines: [
        { w: '小满', t: '马林！左边！' },
        { w: '马林', t: '（浪从侧面拍过来，甲板整个立起来。你听见木头裂开的声音。）' },
        { w: '小满', t: '底舱在进水！' },
        { w: '马林', t: '（水已经到膝盖。船在往下沉，一寸一寸。）' }
      ],
      choices: [
        { t: '先补漏，赌这一船', go: 'stormfix', eff: { water: -8, trust: 6 } },
        { t: '扔货减重，抢风头', go: 'stormdump', eff: { food: -14, trust: 2 } }
      ]

  document.addEventListener('click', function () {
    if (!cur || elOpts.children.length) return;
    if (elBat && elBat.classList.contains('on')) return;
    if (typing) { clearInterval(tmr); done(); return; }
    nextLine();
  });

  /* ================= 敌人立绘 ================= */
  function enemyArt(k) {
    if (k === 'shark') {
      return '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">' +
        '<defs><linearGradient id="skg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a7280"/><stop offset="1" stop-color="#111a22"/></linearGradient></defs>' +
        '<path d="M14 118 C60 84 150 72 234 90 C272 99 296 114 304 128 C290 144 262 156 224 160 C148 168 58 152 14 118 Z" fill="url(#skg)"/>' +
        '<path d="M148 76 L188 26 L208 92 Z" fill="#3d5462"/>' +
        '<path d="M56 132 L34 172 L84 154 Z" fill="#2a3a46"/>' +
        '<path d="M296 126 C282 140 268 148 248 152" stroke="#0a1118" stroke-width="3.5" fill="none"/>' +
        '<path d="M232 142 L300 132" stroke="#0a1118" stroke-width="2.5" fill="none"/>' +
        '<g fill="#e8eef3">' + [0, 1, 2, 3, 4, 5].map(function (i) {
          var x = 244 + i * 9, y = 138 + i * 0.6;
          return '<path d="M' + x + ' ' + y + ' l4 8 l4 -8 z"/>';
        }).join('') + '</g>' +
        '<circle cx="272" cy="116" r="6" fill="#080d12"/><circle cx="273.5" cy="114.5" r="2" fill="#a8dcff"/>' +
        '<path d="M96 100 C140 92 190 96 226 108" stroke="#93a8b5" stroke-width="2" opacity=".45" fill="none"/>' +
        '</svg>';
    }
    if (k === 'raider') {
      return '<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M34 260 C34 202 62 178 100 178 C138 178 166 202 166 260 Z" fill="#161b21"/>' +
        '<path d="M60 150 C60 94 78 70 100 70 C122 70 140 94 140 150 C140 172 122 184 100 184 C78 184 60 172 60 150 Z" fill="#2b333b"/>' +
        '<ellipse cx="100" cy="136" rx="27" ry="31" fill="#0e1319"/>' +
        '<path d="M84 132 L116 132" stroke="#ff7a45" stroke-width="3.2" stroke-linecap="round"/>' +
        '<path d="M88 152 L112 152" stroke="#4a5560" stroke-width="2" stroke-linecap="round"/>' +
        '<path d="M140 196 C176 202 190 226 172 246 C164 254 150 254 144 246" stroke="#7d8894" stroke-width="7" fill="none" stroke-linecap="round"/>' +
        '<path d="M62 214 L44 250" stroke="#2b333b" stroke-width="9" stroke-linecap="round"/>' +
        '<path d="M100 178 L100 214" stroke="#0c1116" stroke-width="4"/>' +
        '</svg>';
    }
    return portrait('deacon');
  }

  /* ================= 战斗 ================= */
  var BS = null;
  var elBat = document.getElementById('battle'), elBArt = document.getElementById('bArt');
  var elBName = document.getElementById('bName'), elBHp = document.getElementById('bHp');
  var elPHp = document.getElementById('pHp'), elPHpNum = document.getElementById('pHpNum');
  var elBMsg = document.getElementById('bMsg'), elBActs = document.getElementById('bActs');
  var elFlash = document.getElementById('flashw');

  function startBattle(b) {
    BS = { b: b, ehp: b.hp, emax: b.hp, busy: false, guard: false };
    elBName.textContent = b.name;
    elBArt.innerHTML = enemyArt(b.art || 'raider');
    elBMsg.textContent = b.intro || '';
    elBat.classList.add('on');
    bBars(); renderActs(); sfx('start');
  }
  function bBars() {
    elBHp.style.width = Math.max(0, BS.ehp / BS.emax * 100) + '%';
    elPHp.style.width = Math.max(0, st.hp) + '%';
    elPHpNum.textContent = Math.max(0, Math.round(st.hp));
    hud();
  }
  function bmsg(t) { elBMsg.textContent = t; }
  function lockActs(on) {
    Array.prototype.forEach.call(elBActs.children, function (b) { b.disabled = on; });
  }
  function renderActs() {
    elBActs.innerHTML = '';
    var list = [
      { k: 'atk', t: '鱼枪突刺' },
      { k: 'guard', t: '横桨格挡' },
      { k: 'heal', t: '喝口水（水 −6）' }
    ];
    if (BS.b.flee > 0) list.push({ k: 'flee', t: '找机会脱身' });
    list.forEach(function (a) {
      var btn = document.createElement('button');
      btn.textContent = a.t;
      btn.addEventListener('click', function (ev) { ev.stopPropagation(); act(a.k); });
      elBActs.appendChild(btn);
    });
  }
  function act(kind) {
    if (!BS || BS.busy) return;
    BS.busy = true; lockActs(true);
    if (kind === 'atk') {
      var dmg = 12 + Math.floor(Math.random() * 9) + (st.trust > 55 ? 3 : 0);
      BS.ehp -= dmg;
      elBArt.classList.remove('shake'); void elBArt.offsetWidth; elBArt.classList.add('shake');
      sfx('hit');
      bmsg('鱼枪扎进去，' + dmg + ' 点伤害。');
      bBars();
      if (BS.ehp <= 0) { setTimeout(winBattle, 700); return; }
      setTimeout(enemyTurn, 720);
    } else if (kind === 'guard') {
      BS.guard = true;
      bmsg('你把桨横过来，压低身子，等它先动。');
      setTimeout(enemyTurn, 620);
    } else if (kind === 'heal') {
      st.water = Math.max(0, st.water - 6); st.hp = Math.min(100, st.hp + 20);
      bBars(); sfx('heal');
      bmsg('你灌下一口水。喉咙里的铁锈味淡了一点。');
      setTimeout(enemyTurn, 680);
    } else if (kind === 'flee') {
      if (Math.random() < BS.b.flee) {
        var esc = BS.b.escape; sfx('win');
        bmsg('你割断缆绳，船滑进黑里。');
        setTimeout(function () { endBattle(); showNode(esc); }, 900);
      } else {
        bmsg('它挡在船头。你没跑掉。');
        setTimeout(enemyTurn, 700);
      }
    }
  }
  function enemyTurn() {
    if (!BS) return;
    var d = BS.b.atk[0] + Math.floor(Math.random() * (BS.b.atk[1] - BS.b.atk[0] + 1));
    if (BS.guard) { d = Math.max(1, Math.round(d * 0.45)); BS.guard = false; }
    st.hp -= d;
    elFlash.style.opacity = '0.34';
    setTimeout(function () { elFlash.style.opacity = '0'; }, 110);
    sfx('hurt'); bBars();
    bmsg((BS.b.hitText || '它撞上来。') + ' 你掉了 ' + d + ' 点血。');
    if (st.hp <= 0) { st.hp = 0; lockActs(true); setTimeout(loseBattle, 800); return; }
    BS.busy = false; lockActs(false);
  }
  function winBattle() {
    var nid = BS.b.win, rw = BS.b.reward || {};
    st.hp = Math.min(100, st.hp + 35);
    if (rw.water) st.water = Math.min(100, st.water + rw.water);
    if (rw.food) st.food = Math.min(100, st.food + rw.food);
    sfx('win'); bBars();
    bmsg(BS.b.winText || '它不动了。血在水里散开，慢慢变淡。');
    setTimeout(function () { endBattle(); showNode(nid); }, 1400);
  }
  function loseBattle() {
    var nid = BS.b.lose; endBattle(); showNode(nid);
  }
  function endBattle() {
    elBat.classList.remove('on');
    elBActs.innerHTML = '';
    BS = null; hud();
  }

  /* ================= 音乐 ================= */
  var AC = null, MG = null, muted = false;
  var PENTA = [220, 261.63, 293.66, 329.63, 392, 440, 523.25];

  function audioInit() {
    try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    if (MG) return;
    MG = AC.createGain(); MG.gain.value = muted ? 0 : 0.15; MG.connect(AC.destination);

    var len = Math.floor(AC.sampleRate * 3), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0), last = 0;
    for (var i = 0; i < len; i++) { var w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
    var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 460;
    var ng = AC.createGain(); ng.gain.value = 0.34;
    src.connect(lp); lp.connect(ng); ng.connect(MG); src.start();
    var lfo = AC.createOscillator(), lg = AC.createGain();
    lfo.frequency.value = 0.05; lg.gain.value = 0.17; lfo.connect(lg); lg.connect(ng.gain); lfo.start();

    [55, 82.5, 110, 164.81].forEach(function (f, i) {
      var o = AC.createOscillator(); o.type = i % 2 ? 'sine' : 'triangle'; o.frequency.value = f;
      var g = AC.createGain(); g.gain.value = 0.055 / (i * 0.7 + 1);
      o.connect(g); g.connect(MG); o.start();
    });

    setInterval(function () {
      if (!AC || muted) return;
      var f = PENTA[Math.floor(Math.random() * PENTA.length)];
      var o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      var g = AC.createGain();
      g.gain.setValueAtTime(0.0001, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.05, AC.currentTime + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 2.4);
      var dl = AC.createDelay(1); dl.delayTime.value = 0.42;
      var fb = AC.createGain(); fb.gain.value = 0.3;
      o.connect(g); g.connect(MG); g.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(MG);
      o.start(); o.stop(AC.currentTime + 2.6);
    }, 3400);
  }

  function sfx(kind) {
    if (!AC || muted) return;
    var t = AC.currentTime;
    if (kind === 'hit' || kind === 'hurt' || kind === 'start') {
      var sec = kind === 'start' ? 0.5 : 0.16;
      var n = Math.floor(AC.sampleRate * sec), b = AC.createBuffer(1, n, AC.sampleRate), c = b.getChannelData(0);
      for (var i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      var s = AC.createBufferSource(); s.buffer = b;
      var f = AC.createBiquadFilter();
      f.type = kind === 'start' ? 'lowpass' : 'bandpass';
      f.frequency.value = kind === 'hurt' ? 320 : (kind === 'start' ? 680 : 1500);
      var g = AC.createGain(); g.gain.value = kind === 'start' ? 0.45 : 0.3;
      s.connect(f); f.connect(g); g.connect(MG); s.start();
    } else if (kind === 'heal') {
      var o = AC.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(440, t); o.frequency.exponentialRampToValueAtTime(680, t + 0.26);
      var g2 = AC.createGain(); g2.gain.value = 0.085;
      o.connect(g2); g2.connect(MG); o.start(); o.stop(t + 0.32);
    } else if (kind === 'win') {
      [523.25, 659.25, 783.99].forEach(function (f, i) {
        var o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
        var g = AC.createGain();
        g.gain.setValueAtTime(0.0001, t + i * 0.11);
        g.gain.exponentialRampToValueAtTime(0.075, t + i * 0.11 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.11 + 0.9);
        o.connect(g); g.connect(MG); o.start(t + i * 0.11); o.stop(t + i * 0.11 + 1);
      });
    }
  }

  var muteBtn = document.getElementById('muteBtn');
  function setMuted(m) {
    muted = m;
    muteBtn.classList.toggle('off', m);
    if (MG) MG.gain.value = m ? 0 : 0.15;
    try { localStorage.setItem('dryland_mute', m ? '1' : '0'); } catch (e) {}
  }
  try { muted = localStorage.getItem('dryland_mute') === '1'; } catch (e) {}
  muteBtn.classList.toggle('off', muted);
  muteBtn.addEventListener('click', function (e) { e.stopPropagation(); audioInit(); setMuted(!muted); });

  /* ================= 背景 ================= */
  var cv = document.getElementById('bgg'), ctx = cv.getContext('2d');
  var W, H, bgMode = 'sea', t0 = performance.now(), dots = [];
  function resize() {
    W = cv.width = Math.floor(window.innerWidth * Math.min(devicePixelRatio, 2));
    H = cv.height = Math.floor(window.innerHeight * Math.min(devicePixelRatio, 2));
    cv.style.width = window.innerWidth + 'px';
    cv.style.height = window.innerHeight + 'px';
    dots = [];
    for (var i = 0; i < 90; i++) dots.push({ x: Math.random() * W, y: Math.random() * H * .5, r: Math.random() * 1.4 * Math.min(devicePixelRatio, 2), a: Math.random() });
  }
  window.addEventListener('resize', resize); resize();

  var TINTS = {
    sea: [[5, 10, 20], [12, 30, 52], [18, 52, 78], [10, 24, 40]],
    atoll: [[8, 8, 16], [26, 22, 44], [40, 30, 58], [14, 12, 26]],
    night: [[3, 5, 12], [8, 14, 30], [14, 26, 48], [6, 10, 22]],
    storm: [[4, 6, 12], [12, 16, 26], [22, 26, 38], [8, 10, 18]],
    shore: [[10, 14, 22], [30, 46, 62], [70, 92, 96], [22, 34, 40]]
  };
  function setBg(m) { bgMode = m; }
  function triplet(t, k) { return 'rgb(' + Math.round(t[0] * k) + ',' + Math.round(t[1] * k) + ',' + Math.round(t[2] * k) + ')'; }

  function draw(now) {
    var t = (now - t0) / 1000;
    var T = TINTS[bgMode] || TINTS.sea;
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, triplet(T[0], 1));
    g.addColorStop(.42, triplet(T[1], 1));
    g.addColorStop(.62, triplet(T[2], .55));
    g.addColorStop(1, triplet(T[3], 1));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // stars / embers
    var starCol = bgMode === 'atoll' ? '255,196,120' : (bgMode === 'storm' ? '150,170,190' : '190,225,255');
    dots.forEach(function (s) {
      var a = .12 + .55 * Math.abs(Math.sin(t * .6 + s.a * 9));
      ctx.fillStyle = 'rgba(' + starCol + ',' + (a * (bgMode === 'shore' ? .22 : .5)) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    });

    // horizon glow
    var hy = H * .52;
    var hg = ctx.createRadialGradient(W * .5, hy, 0, W * .5, hy, Math.max(W, H) * .55);
    hg.addColorStop(0, 'rgba(' + T[2].join(',') + ',.34)');
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H * .8);

    // sea
    var base = bgMode === 'storm' ? H * .50 : hy;
    for (var k = 0; k < 6; k++) {
      ctx.beginPath();
      ctx.moveTo(0, base + k * 16 * devicePixelRatio);
      for (var x = 0; x <= W; x += 14 * devicePixelRatio) {
        var amp = bgMode === 'storm' ? (9 + k * 4) : (3 + k * 1.6);
        var y = base + k * 16 * devicePixelRatio + Math.sin(x * .0035 + t * (.5 + k * .16) + k * 1.7) * amp * devicePixelRatio;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
      ctx.fillStyle = 'rgba(' + T[1].join(',') + ',' + (.20 + k * .11) + ')';
      ctx.fill();
    }

    // atoll lights
    if (bgMode === 'atoll') {
      for (var i = 0; i < 26; i++) {
        var lx = (i * 97 % W);
        var ly = hy - 6 * devicePixelRatio + Math.sin(i * 2.1) * 5;
        var flick = .5 + .5 * Math.sin(t * 3 + i);
        ctx.fillStyle = 'rgba(255,190,110,' + (.25 + .5 * flick) + ')';
        ctx.fillRect(lx, ly, 3 * devicePixelRatio, 2 * devicePixelRatio);
      }
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ================= 启动 ================= */
  function hideCover() { elCover.classList.add('hide'); }
  var saved = null;
  try { var raw = localStorage.getItem(SAVE); if (raw) saved = JSON.parse(raw); } catch (e) {}
  if (saved && N[saved.n]) document.getElementById('continueBtn').style.display = 'block';

  document.getElementById('startBtn').addEventListener('click', function () {
    audioInit();
    st = { water: 62, food: 55, trust: 40, hp: 100 };
    hud(); hideCover(); showNode('start');
  });
  document.getElementById('continueBtn').addEventListener('click', function () {
    audioInit();
    if (saved && saved.st) { st = saved.st; }
    if (typeof st.hp !== 'number') st.hp = 100;
    hud(); hideCover(); showNode(saved && N[saved.n] ? saved.n : 'start');
  });
  hud();
})();
</script>
</body>
