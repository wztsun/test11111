<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hutudan.com · 测试页</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       background:#0f1115;color:#e8eaed;padding:24px}
  .card{width:100%;max-width:560px;background:#171a21;border:1px solid #262b36;border-radius:16px;padding:32px 28px}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:.5px}
  .sub{color:#8b93a3;font-size:13px;margin-bottom:22px}
  .ok{display:inline-flex;align-items:center;gap:8px;background:#12301f;color:#5ce08a;
      border:1px solid #1e5236;border-radius:999px;padding:5px 12px;font-size:13px;margin-bottom:22px}
  .dot{width:7px;height:7px;border-radius:50%;background:#5ce08a;box-shadow:0 0 0 3px rgba(92,224,138,.18)}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14px}
  dt{color:#8b93a3}
  dd{margin:0;word-break:break-all;font-variant-numeric:tabular-nums}
  footer{margin-top:24px;padding-top:16px;border-top:1px solid #262b36;color:#6b7382;font-size:12px}
  code{background:#0f1115;border:1px solid #262b36;border-radius:6px;padding:1px 6px;font-size:12px}
</style>
</head>
<body>
  <main class="card">
    <h1>hutudan.com 测试页</h1>
    <div class="sub">sub domain test11111</div>
    <div class="ok"><span class="dot"></span>页面正常加载</div>
    <dl>
      <dt>当前访问</dt><dd id="host">-</dd>
      <dt>协议</dt><dd id="proto">-</dd>
      <dt>本地时间</dt><dd id="time">-</dd>
      <dt>解析 IP</dt><dd id="ip">—</dd>
    </dl>
    <footer>静态测试页 · 仅用于验证域名与解析是否生效 · <code id="build">build-1</code></footer>
  </main>
<script>
  (function(){
    document.getElementById('host').textContent = location.host;
    document.getElementById('proto').textContent = location.protocol.replace(':','');
    document.getElementById('time').textContent = new Date().toLocaleString('zh-CN',{hour12:false});
  })();
</script>
</body>
</html>
